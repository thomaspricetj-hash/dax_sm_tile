[package]
name = "syntheticmind-dax"
version = "0.1.0"
edition = "2021"
description = "DAX GPU Architecture – Delta-State Compute Accelerator"
license = "MIT"

[lib]
name = "syntheticmind_dax"
path = "lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
rayon = "1.10"

[features]
default = []
gpu-sim = []
hbm-roundabout = []
